server.port=${AUTH_PORT:9000}
spring.application.name=jerokysys-auth
spring.config.import=classpath:config/private.properties

# --- Base de datos compartida (Neon) ---
spring.datasource.url=${db.url}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# La tabla users vive en el schema "auth"; el DDL lo aplica commons.
spring.jpa.properties.hibernate.default_schema=auth

# Clave con la que se firma el token; debe ser igual en todos los microservicios
jwt.secret=${JWT_SECRET:nQic8KmHIa0kK7cpRVjLCVHHqMNBsZVmc3191egDTnE=}
# Algoritmo de firma
jwt.algorithm=HS256
# Minutos que dura el token desde que se emite
jwt.expiration-minutes=10
# Texto fijo del claim sub
jwt.subject=Test token
# Quien emite el token (claim iss)
jwt.issuer=
# Nombre del claim donde va el usuario
jwt.claim.user=id
# Nombre del claim donde va el rol
jwt.claim.role=role

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Límite de intentos fallidos por usuarios
# Seguido se bloquea el usuario (response 429)
login.max-attempts=5
login.lock-minutes=15

# --- Documentacion y logs ---
springdoc.api-docs.enabled=true
logging.file.name=app.log
logging.level.com.jerokysys.auth=INFO
logging.level.com.jerokysys.auth.service=DEBUG
logging.level.com.jerokysys.auth.security=DEBUG
