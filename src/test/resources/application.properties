# Este archivo REEMPLAZA a src/main/resources/application.properties en el
# classpath de test (target/test-classes va antes que target/classes), por eso
# repite todas las propiedades necesarias.

# H2 en memoria. ddl-auto=none: no se valida ni se crea el esquema (las tablas
# reales viven en el schema "auth" de Postgres).
spring.datasource.url=jdbc:h2:mem:authtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Sin Eureka en tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# JWT (misma clave que en runtime para que los tests sean representativos)
jwt.secret=010n8oOYo5mRuTHa4b1fSZ4/i/5H2ACEsCCwiEy1CDk=
jwt.algorithm=HS256
jwt.expiration-minutes=10
jwt.subject=jerokysys-auth
jwt.issuer=
jwt.claim.user=username
jwt.claim.role=role

# Bloqueo de intentos
login.max-attempts=5
login.lock-minutes=15
